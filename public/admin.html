<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fleet administration | LIMO</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/bookings.css"><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><header class="bookings-header"><a href="/"><span class="brand-name">LIMO</span><span class="brand-subtitle">AUSTRALIA</span></a><a href="/fleets.html">View public fleet &rarr;</a></header>
<main><p class="eyebrow">Administration</p><div class="heading"><h1>Manage your fleet</h1><button id="logout" class="button" hidden>Log out</button></div>
<p id="message" role="status" aria-live="polite"></p>
<form id="login-form" class="admin-panel"><h2>Admin login</h2><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button class="button button-gold">Log in</button></form>
<section id="workspace" hidden><div class="admin-layout"><form id="car-form" class="admin-panel"><h2 id="editor-title">Add a car</h2><label for="car-name">Car name</label><input id="car-name" required maxlength="100"><label for="description">Description</label><textarea id="description" required maxlength="1000" rows="4"></textarea><label for="image-url">Image URL</label><input id="image-url" type="url" placeholder="https://..." required maxlength="2000"><label for="passengers">Passengers</label><input id="passengers" type="number" min="1" max="100" step="1" required value="3"><div class="editor-actions"><button id="save" class="button button-gold">Add car</button><button id="cancel" class="button" type="button" hidden>Cancel edit</button></div></form><section><h2>Fleet cars <span id="car-count"></span></h2><button id="reload" class="button" type="button">Refresh list</button><div id="car-list"></div></section></div></section></main></body></html>
